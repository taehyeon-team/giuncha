*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#f7f8fa;color:#2b221c;font-family:'Pre',sans-serif;word-break:keep-all}
#f{position:absolute;left:0;top:0;padding:34px 60px 98px;display:flex;flex-direction:column;justify-content:safe center;background:#f7f8fa}
.hl{font-size:60px;font-weight:800;line-height:1.22;letter-spacing:-.5px}
.tt{font-size:38px;font-weight:800;line-height:1.3}
.bd{font-size:30px;line-height:1.45}
.lb{font-size:24px;font-weight:600;color:#4b5260}
.hl,.tt,.bd,.cd b{text-wrap:balance}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} input{-webkit-user-select:text;user-select:text}
.say.n:after{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.grow{flex:1}.row{display:flex;gap:18px;align-items:stretch}
.chip{display:inline-block;background:#fff;border:1.5px solid #d9dde4;border-radius:999px;padding:10px 24px;font-size:24px;font-weight:600}
.hero{border-radius:40px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd{background:#fff;border:1.5px solid #e1e4ea;border-radius:26px;padding:22px 28px}
.cd b{font-size:32px;display:block;margin-top:4px;font-weight:800}
.btn{height:92px;border-radius:999px;background:#2b221c;color:#fff;font-size:30px;font-weight:800;display:grid;place-items:center;padding:0 44px}
.btn.ghost{background:#fff;color:#2b221c;border:1.5px solid #c9ced8}
.btn:active,.tap:active{transform:scale(.97)}
.mo{display:block;overflow:visible}
.say{background:#fff;border:1.5px solid #e1e4ea;border-radius:36px;padding:34px 40px;position:relative}
.say:after{content:'';position:absolute;right:-17px;top:76px;width:32px;height:32px;background:#fff;border-right:1.5px solid #e1e4ea;border-top:1.5px solid #e1e4ea;transform:rotate(45deg)}
.say.l:after{right:auto;left:-17px;border:0;border-left:1.5px solid #e1e4ea;border-bottom:1.5px solid #e1e4ea}
.who{font-size:24px;font-weight:800;color:#8a6f5a;margin-bottom:10px}
input,select{font-family:'Pre',sans-serif;font-size:34px;font-weight:600;color:#2b221c;background:#fff;border:2px solid #2b221c;border-radius:22px;padding:18px 24px;outline:none}
.emo{background:#fff;border:1.5px solid #d9dde4;border-radius:26px;padding:26px 28px;font-size:36px;font-weight:800;display:flex;align-items:center;gap:16px}
.emo i{width:22px;height:22px;border-radius:50%;display:block}
/* 주차 중에만 움직인다. 달릴 때 화면에는 아래 움직임을 쓰지 않는다 */
@keyframes breathe{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(5px) scale(1.035,.965)}}
@keyframes hop{0%,74%,100%{transform:translateY(0) rotate(0) scale(1,1)}79%{transform:translateY(-44px) rotate(-7deg) scale(.97,1.04)}84%{transform:translateY(0) scale(1.07,.93)}89%{transform:translateY(-28px) rotate(6deg) scale(.98,1.03)}94%{transform:translateY(0) scale(1.05,.95)}}
@keyframes joy{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-34px) scale(.96,1.05)}60%{transform:translateY(0) scale(1.08,.92)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes blink{0%,91%,100%{opacity:0}93%,97%{opacity:1}}
@keyframes unblink{0%,91%,100%{opacity:1}93%,97%{opacity:0}}
.live{position:relative;display:inline-block;transform-origin:50% 92%}
.live .b{position:absolute;left:0;top:0;opacity:0}
.live.on{animation:breathe 2.6s ease-in-out infinite}
.live.on .a{animation:unblink 4.6s linear infinite}.live.on .b{animation:blink 4.6s linear infinite}
.hopper{display:inline-block;transform-origin:50% 92%;animation:hop 7s ease-in-out infinite}
.joyer{display:inline-block;transform-origin:50% 92%;animation:joy .9s ease-in-out 3}
.popin{display:inline-block;transform-origin:50% 92%;animation:pop .5s ease-out both}

   <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:24px">${d.emotions.map(a=>`<div class="emo tap" style="font-size:${a.length>5?27:34}px;padding:24px 20px" onclick="go('emo:${a}')"><i style="background:${EMO[a]}"></i>${a}</div>`).join('')}<div class="emo tap" style="font-size:28px;color:#6b7280;justify-content:center" onclick="go('ok')">오늘은 넘어갈게요</div></div>
   <div class="lb" style="margin-top:18px;font-weight:400">기록은 이 차 안에만 · 다시 볼 땐 한 번 더 물어봐요</div></div></div>`,
 reply:d=>`${hdr(d,'퇴근 · 주차 중'+SOLOBTN(d))}<div class="row grow" style="gap:44px;align-items:center"><div style="flex:.8;text-align:center">${d.positive?`<span class="joyer">${pal(d.ch,400,'happy',d.g)}</span>`:pal(d.ch,400,({'괜찮아요':'normal','생각이 많아요':'sleepy','불안해요':'nervous','짜증나요':'careful','우울해요':'relieved'})[d.tag]||'relieved',d.g)}<div class="chip" style="margin-top:6px">${tagOf(d)}</div></div>
   <div style="flex:1.5"><span class="chip"><span style="color:${EMO[d.tag]||'#999'}">●</span> ${esc(d.tag)}</span> <span class="chip" style="background:#eef7f0;border-color:#9cc9a8;color:#25613a">✓ 오늘 한 단어 저장했어요</span>
   <div class="say l" style="margin-top:16px"><div class="who">${esc(d.fname)}</div><div class="hl" style="font-size:72px">${esc(d.empathy)}</div>${d.next?`<div class="bd" style="margin-top:14px">${esc(d.next)}</div>`:''}</div>
   <div class="row" style="margin-top:22px;align-items:center">${d.nextEl?`<div class="cd"><div class="lb">내일 아침의 색</div><b><span style="color:${ORB[d.nextEl]}">●</span> ${esc(d.nextColor)}</b></div>`:''}${d.wordBok?`<div class="cd"><div class="lb">한 단어 남긴 복</div><b>+${d.wordBok}</b></div>`:''}</div>
   <div class="row" style="margin-top:18px"><div class="btn tap" style="white-space:nowrap" onclick="go('ok')">내일 아침에 만나요</div>${d.canTalk?`<div class="btn ghost tap" style="white-space:nowrap" onclick="go('talk')">조금 더 이야기할래요</div>`:''}</div>
   <div class="btn ghost tap" style="height:68px;font-size:24px;margin-top:14px;display:inline-grid" onclick="go('redo')">잘못 눌렀어요 · 다시 고를게요</div></div></div>`,
 hello:d=>`${hdr(d,(d.bye?'오늘은 여기까지':'퇴근길')+SOLOBTN(d)+SETBTN)}<div class="row grow" style="gap:44px;align-items:center"><div style="flex:.8;text-align:center">${pal(d.ch,400,d.bye?'happy':'normal',d.g)}<div class="chip" style="margin-top:6px">${tagOf(d)}</div></div>
   <div style="flex:1.5"><div class="say l"><div class="who">${esc(d.fname)}</div><div class="hl" style="font-size:76px">${esc(d.msg1)}</div><div class="bd" style="font-size:36px;margin-top:16px">${esc(d.msg2)}</div></div>
   ${d.canAsk?`<div class="row" style="margin-top:24px"><div class="btn ghost tap" onclick="go('asknow')">지금 한 단어 남기기</div></div>`:''}</div></div>`,
 companion:d=>`${hdr(d,'같이 타고 있어요')}<div class="row grow" style="gap:44px;align-items:center"><div style="flex:.8;text-align:center"><span class="hopper">${pal(d.ch,400,'happy',d.g)}</span><div class="chip" style="margin-top:6px">${tagOf(d)}</div></div>
   <div style="flex:1.5"><div class="say l"><div class="who">${esc(d.fname)}</div><div class="hl" style="font-size:84px">오늘은 같이 가는 날</div><div class="bd" style="font-size:34px;margin-top:14px">오늘은 옆자리와 즐겁게 가세요.</div></div>
   <div class="row" style="margin-top:26px"><div class="btn tap" onclick="go('pickgo')">옆자리 친구 만나기</div><div class="btn ghost tap" id="solo" style="font-size:26px">${esc(d.soloLabel||'혼자예요')}</div></div></div></div>`,
 pick:d=>`${hdr(d,'둘이 탑승 · 조합 도감 '+d.dex+'/15')}<div class="hl" style="font-size:72px">옆자리는 무슨 띠예요?</div><div class="bd" style="color:#4b5260;margin-top:6px">생일은 안 물어봐요 · 오늘만 쓰고 저장하지 않아요</div>
   <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:26px">${ANI.map((a,i)=>`<div class="cd tap" onclick="go('pick:${i}')" style="text-align:center;padding:12px 0 16px;background:${PASTEL[AEL[i]]}"><div style="display:grid;place-items:center">${mo(a,150,'normal',0)}</div><b style="font-size:30px">${a}</b></div>`).join('')}</div>
   <div class="row" style="margin-top:22px"><div class="btn ghost tap" style="flex:1" onclick="go('ok')">오늘은 그냥 갈래요</div></div>`,
 combo:d=>{const a=d.me.el,b=AEL[d.partner],c=combo(a,b),pn=ANI[d.partner];
  return `${hdr(d,'둘이 탑승 · 조합 도감 '+d.dex+'/15')}<div class="row grow" style="gap:14px;align-items:center">
   <div style="text-align:center;flex:none"><span class="joyer">${pal(d.ch,230,'happy',d.g)}</span><div><span class="chip">${esc(d.fname)} · 나</span></div></div>
   <div class="hl" style="font-size:70px;flex:none">+</div>
   <div style="text-align:center;flex:none"><span class="joyer" style="animation-delay:.2s">${pal(pn,230,'happy',0)}</span><div><span class="chip">옆자리 · ${NAME[b]} ${pn}띠</span></div></div>
   <div class="grow" style="margin-left:26px;min-width:0"><div class="say l"><div class="who">${esc(d.fname)} · 오늘의 조합</div><div class="hl" style="font-size:76px;white-space:nowrap">${c[0]}</div><div class="bd" style="font-size:32px;margin-top:8px">${c[1]}</div></div>
   <div class="cd" style="margin-top:18px"><div class="lb">오늘의 미션</div><b style="font-size:38px">${c[2]}</b></div>
   <div class="row" style="margin-top:20px"><div class="btn tap" onclick="go('ok')">좋아요</div></div>
   <div class="lb" style="margin-top:14px;font-weight:400">"안 맞는 조합"은 없어요</div></div></div>`},
 gate:d=>`${hdr(d,'내 기록'+(d.passenger?' · 동승자 있음':''))}<div class="row grow" style="gap:44px;align-items:center"><div style="flex:.8;text-align:center">${pal(d.ch,400,'normal',d.g)}<div class="chip" style="margin-top:6px">${tagOf(d)}</div></div>
   <div style="flex:1.5"><div class="say l"><div class="who">${esc(d.fname)}</div><div class="hl" style="font-size:76px">${d.passenger?'기록은 혼자일 때만<br>열려요':'지난 마음 기록을<br>열어 볼까요?'}</div><div class="bd" style="font-size:34px;margin-top:14px">${d.passenger?'옆에 누가 타고 있어요.':'화면에 그동안 고른 마음 단어가 보여요.'}</div></div>
   <div class="row" style="margin-top:26px">${d.passenger?'':`<div class="btn tap" id="open">혼자예요, 열기</div>`}<div class="btn ghost tap" onclick="go('later')">${d.passenger?'돌아가기':'다음에'}</div></div></div></div>`,
 week:d=>`${hdr(d,'내 기록 · 지난 7일')}<div class="row" style="align-items:center;gap:30px"><div class="grow"><div class="bd" style="color:#4b5260">${esc(d.name)}님의 지난 7일</div><div class="hl" style="font-size:72px">타면 탈수록, 나를 알아가요</div></div>
   ${d.grew?`<div class="cd" style="display:flex;align-items:center;gap:6px;padding:10px 26px 10px 14px;background:${PASTEL[d.myEl]}"><span style="opacity:.5">${mo(d.animal,110,'normal',0)}</span><span class="tt">→</span><span class="joyer">${pal(d.animal,170,'happy',1)}</span><div style="margin-left:10px"><div class="tt">${esc(d.fname)}가 조금 자랐어요!</div><div class="lb">함께 탄 날이 일주일이 됐어요</div></div></div>`:`<div style="text-align:center">${pal(d.ch,170,'normal',d.g)}</div>`}</div>
   <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:14px;margin-top:26px">${d.days.map(x=>`<div class="cd" style="text-align:center;padding:8px 4px 16px;background:${PASTEL[x.el]||'#fff'}"><div style="display:grid;place-items:center;${x.tag==='-'?'opacity:.3':''}">${mo(d.ch,160,MOOD[x.tag]||'normal',d.g)}</div><div class="lb" style="margin-top:2px">${x.w}</div><b style="font-size:${x.tag.length>5?23:27}px;margin-top:2px"><span style="color:${EMO[x.tag]||'#c9ced6'}">●</span> ${esc(x.tag)}</b></div>`).join('')}</div>
   <div class="say n" style="margin-top:22px;padding:28px 36px"><div class="who">${esc(d.fname)}</div><div class="tt">${esc(d.s1)}</div>${d.s2?`<div class="bd" style="margin-top:8px;color:#4b5260">${esc(d.s2)}</div>`:''}</div>
   <div class="row" style="margin-top:14px;align-items:center"><div class="btn ghost tap" style="height:76px" onclick="go('later')">닫기</div>${d.demo?'<div class="lb" style="font-weight:400;align-self:center">시연용 예시 기록 포함</div>':''}</div>`,
 road:d=>`${hdr(d,'주차 뒤 · 오늘 지나온 길')}<div class="row grow" style="gap:44px;align-items:center"><div style="flex:.8;text-align:center"><span class="joyer">${pal(d.ch,400,'happy',d.g)}</span><div class="chip" style="margin-top:6px">${tagOf(d)}</div></div>
   <div style="flex:1.5"><div class="say l"><div class="who">${esc(d.fname)}</div>${gline(d)}<div class="hl" style="font-size:68px">오늘도 조심히 지나왔어요</div><div class="bd" style="margin-top:8px;color:#4b5260">${d.tripBok?`복 +${d.tripBok} · 모은 복 ${d.bok}`:`오늘의 복은 이미 받았어요 · 모은 복 ${d.bok}`}</div></div>
   ${d.events.map(e=>`<div class="cd" style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;padding:18px 28px"><b style="margin:0">${esc(e.k)}</b><span class="lb">${e.n}곳 지나왔어요</span></div>`).join('')}
   <div class="row" style="margin-top:22px"><div class="btn tap" onclick="go('ok')">좋아요</div></div>
   <div class="lb" style="margin-top:14px;font-weight:400">복은 하루 한 번, 운행을 마치면 쌓여요 · 횟수나 속도로 겨루지 않아요</div></div></div>`,
 myfriend:d=>{const forms=[[0,'처음 만난 모습','처음부터'],[1,'조금 자란 모습','함께 탄 날 7일'],[2,'다 자란 모습','함께 탄 날 60일']];const zod=d.animal,isG=!!G[d.ch];
  return `${hdr(d,'내 친구 · 모은 복 '+d.bok)}<div class="row grow" style="gap:36px;align-items:center"><div style="flex:.72;text-align:center"><div class="hero" style="background:${PASTEL[d.myEl]||'#eef0f3'};height:520px"><span class="hopper">${pal(d.ch,320,'happy',d.g)}</span><div class="chip" style="margin-top:6px">${tagOf(d)}</div></div>
   <div class="row" style="margin-top:14px;justify-content:center;align-items:center"><input id="fn" value="${esc(d.fname)}" maxlength="8" style="width:210px;font-size:28px;padding:14px 18px"><div class="btn ghost tap" style="height:70px;font-size:24px;padding:0 22px" onclick="go('rename:'+document.getElementById('fn').value)">이름 바꾸기</div></div></div>
   <div style="flex:1.5"><div class="tt">${isG?zod+'띠 친구 모습 고르기':'모습 고르기'}</div><div class="lb" style="font-weight:400">함께 탄 날 ${d.rides}일 · 자란 뒤에도 예전 모습으로 둘 수 있어요</div>
   <div class="row" style="margin-top:12px">${forms.map(([g,a,b])=>{const ok=g<=d.gMax,on=!isG&&d.g===g;return `<div class="cd ${ok?'tap':''}" ${ok?`onclick="go('form:${g}')"`:''} style="flex:1;text-align:center;padding:8px 6px 14px;${on?'border:3px solid #2b221c;':''}"><div style="display:grid;place-items:center;${ok?'':'opacity:.4'}">${mo(zod,124,'normal',g)}</div><b style="font-size:24px">${a}</b><div class="lb" style="font-size:22px">${ok?(on?'지금 모습':'고르기'):Math.max(1,(g===1?7:60)-d.rides)+'일 더 타면'}</div></div>`}).join('')}</div>
   <div class="tt" style="margin-top:22px">수호 친구</div><div class="lb" style="font-weight:400">복 150으로 만나요 · 만난 뒤에는 띠 친구와 번갈아 탈 수 있어요</div>
   <div class="row" style="margin-top:12px;gap:12px"><div class="cd tap" onclick="go('kind:')" style="flex:1;text-align:center;padding:8px 2px 14px;${!isG?'border:3px solid #2b221c':''}"><div style="display:grid;place-items:center">${mo(zod,100,'normal',d.gMax)}</div><b style="font-size:22px">${zod}띠 친구</b><div class="lb" style="font-size:22px">${!isG?'함께 타는 중':'고르기'}</div></div>
   ${['청룡','주작','해태','백호','현무'].map(n=>{const own=d.owned.includes(n),on=d.ch===n,can=d.bok>=150;return `<div class="cd ${own||can?'tap':''}" ${own||can?`onclick="go('kind:${n}')"`:''} style="flex:1;text-align:center;padding:8px 2px 14px;${on?'border:3px solid #2b221c;':''}"><div style="display:grid;place-items:center;${own||can?'':'opacity:.4'}">${mo(n,100,'normal',1)}</div><b style="font-size:22px">${n}</b><div class="lb" style="font-size:22px">${on?'함께 타는 중':own?'고르기':can?(d.pendingBuy===n?'한 번 더!':'만나기'):'복 150'}</div></div>`}).join('')}</div>
   <div class="row" style="margin-top:20px"><div class="btn ghost tap" onclick="go('back')">돌아가기</div><div class="btn ghost tap" onclick="go('settings')">설정</div></div></div></div>`},
 talkask:d=>`${hdr(d,'마음 대화 · 주차 중에만')}<div class="row grow" style="gap:44px;align-items:center"><div style="flex:.8;text-align:center">${pal(d.ch,400,'normal',d.g)}<div class="chip" style="margin-top:6px">${tagOf(d)}</div></div>
   <div style="flex:1.5"><div class="say l"><div class="who">${esc(d.fname)}</div><div class="hl" style="font-size:68px">가장 마음에 걸린 건<br>뭐였어요?</div><div class="bd" style="margin-top:8px;color:#4b5260">하나만 골라 주세요. 말하고 싶지 않으면 넘어가도 돼요.</div></div>
   <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:22px">${['일','사람','몸','모르겠어요'].map(a=>`<div class="emo tap" style="justify-content:center;font-size:${a.length>3?30:36}px" onclick="go('topic:${a}')">${a}</div>`).join('')}</div>
   <div class="row" style="margin-top:18px"><div class="btn ghost tap" onclick="go('talkstop')">오늘은 여기까지 할게요</div></div>${FOOT}</div></div>`,
 talkreply:d=>`${hdr(d,'마음 대화 · 주차 중에만')}<div class="row grow" style="gap:44px;align-items:center"><div style="flex:.8;text-align:center">${pal(d.ch,400,'relieved',d.g)}<div class="chip" style="margin-top:6px">${tagOf(d)}</div></div>
   <div style="flex:1.5"><span class="chip">${esc(d.topic)}</span><div class="say l" style="margin-top:14px"><div class="who">${esc(d.fname)}</div><div class="tt" style="font-size:46px;line-height:1.32">${esc(d.line)}</div></div>
   <div class="cd" style="margin-top:16px"><div class="lb">오늘 밤 작은 행동 하나</div><b>${esc(d.action)}</b></div>
   <div class="row" style="margin-top:20px"><div class="btn tap" onclick="go('talkstop')">오늘은 여기까지</div><div class="btn ghost tap" onclick="go('talkkeep')">내일 아침에 한마디 더 듣기</div></div>${FOOT}</div></div>`,
 mode:d=>{const sel=t=>d.theme===t?'<span class="chip" style="position:absolute;top:20px;right:20px;background:#2b221c;color:#fff;border-color:#2b221c">선택됨 ✓</span>':'';
  const foot=d.wipeAsk?`<div class="cd" style="margin-top:18px;display:flex;align-items:center;gap:18px;border:2.5px solid #2b221c"><div class="grow"><b style="margin:0">정말 지울까요?</b><div class="lb" style="font-weight:400;margin-top:4px">이름 · 생일 · 마음 기록 · 친구 · 복이 모두 지워지고 되돌릴 수 없어요.</div></div><div class="btn ghost tap" style="color:#b3261e;border-color:#b3261e;margin-right:30px" onclick="go('wipe')">지우기</div><div class="btn tap" onclick="go('wipecancel')">그만두기</div></div>`
   :`<div class="row" style="margin-top:18px;align-items:center"><div class="btn ghost tap" onclick="go('back')">돌아가기</div><div class="lb grow" style="font-weight:400;align-self:center;text-align:right">이름 · 생일 · 마음 기록은 이 차 안에만 저장돼요</div>${d.hasBirth?`<div class="btn ghost tap" style="font-size:26px" onclick="go('wipeask')">기록 지우고 처음부터</div>`:''}</div>`;
  return `${hdr(d,'설정')}<div class="hl" style="font-size:64px">화면 모드 고르기</div><div class="bd" style="color:#4b5260;margin-top:4px">계산은 똑같아요. 보는 맛만 달라요.</div>
  <div class="row" style="margin-top:20px;gap:22px">
   <div class="cd tap" onclick="go('theme:friend')" style="flex:1;height:440px;position:relative;background:${PASTEL[d.myEl]||'#eef0f3'};padding:32px"><div class="lb">캐릭터 모드 · 기본</div><div class="tt" style="font-size:44px;margin-top:8px">내 띠 친구가<br>오늘을 알려 줘요</div><div style="position:absolute;right:16px;bottom:6px"><span class="hopper">${pal(d.ch,250,'happy',d.g)}</span></div>${sel('friend')}</div>
   <div class="cd tap" onclick="go('theme:calm')" style="flex:1;height:440px;position:relative;overflow:hidden;background:#0b1530;border:0;padding:32px;color:#fff"><div style="position:absolute;inset:0;background:radial-gradient(circle at 75% 30%,#3d7bd9 0,transparent 45%),radial-gradient(circle at 92% 85%,#56c2d6 0,transparent 40%),radial-gradient(circle at 15% 95%,#2a3f8f 0,transparent 50%)"></div><div style="position:relative"><div class="lb" style="color:#c9d4f0">차분 모드</div><div style="font-size:46px;font-weight:400;margin-top:130px;line-height:1.2">물의 기운,<br><b style="font-weight:800">서두르지 않아도<br>괜찮아요.</b></div></div>${sel('calm')}</div>
   <div class="cd tap" onclick="go('theme:kitsch')" style="flex:1;height:440px;position:relative;background:#ffd43b;border:5px solid #16130f;box-shadow:8px 8px 0 #16130f;padding:32px"><div class="lb" style="color:#16130f">키치 모드</div><div style="font-size:68px;font-weight:800;margin-top:10px;line-height:1.1">기운 배달<br>왔습니다~</div><div class="bd" style="position:absolute;left:32px;bottom:26px;font-weight:600">말투도 고를 수 있어요<br>순한맛 ↔ 매운맛</div>${sel('kitsch')}</div></div>${foot}`},
};
function sendSetup(){const v=id=>document.getElementById(id).value,p=n=>String(n).padStart(2,'0');
 if(!v('nm').trim()){document.getElementById('nm').focus();return;}
 const last=new Date(+v('by'),+v('bm'),0).getDate(),day=Math.min(+v('bd'),last);
 go('setup:'+v('nm').replace(/\|/g,'')+'|'+v('by')+'-'+p(v('bm'))+'-'+p(day));}

function fit(k){k=k||1;const f=document.getElementById('f');const z=Math.min(innerWidth/1400,innerHeight/1007)/k;f.style.width=(1400*k)+'px';f.style.height=(1007*k)+'px';f.style.transform='scale('+z+')';f.style.transformOrigin='0 0';}
addEventListener('contextmenu',e=>e.preventDefault());
